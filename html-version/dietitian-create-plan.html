<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DietSync – Create Meal Plan</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="page-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <span class="logo-icon"></span>
        <span class="logo-text">DietSync</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dietitian-dashboard.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Dashboard
      </a>
      <a href="dietitian-users.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Users
      </a>
      <a href="dietitian-create-plan.html" class="nav-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="2" x2="3" y2="12"/><path d="M3 12a2 2 0 0 0 4 0V6"/><line x1="5" y1="2" x2="5" y2="6"/><line x1="7" y1="2" x2="7" y2="6"/><line x1="21" y1="2" x2="21" y2="22"/><path d="M17 2a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2v8"/></svg>
        Meal Plans
      </a>
      <a href="dietitian-meal-logs.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Meal Logs
      </a>
      <a href="dietitian-feedback.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Feedback
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="login.html" class="nav-link" style="margin-bottom:0;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="max-w-1200">
      <h1 class="text-3xl mb-8">Create Meal Plan</h1>

      <div class="card p-6">
        <form id="plan-form">

          <!-- Select User -->
          <div class="form-group">
            <label for="user-select">Select User</label>
            <div class="select-wrapper">
              <select id="user-select">
                <option>John Doe (john@example.com)</option>
                <option>Jane Smith (jane@example.com)</option>
                <option>Mike Johnson (mike@example.com)</option>
                <option>Sarah Williams (sarah@example.com)</option>
                <option>Tom Brown (tom@example.com)</option>
              </select>
              <span class="select-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </span>
            </div>
          </div>

          <!-- Breakfast Plan -->
          <div class="form-group">
            <label for="breakfast">Breakfast Plan</label>
            <textarea id="breakfast" rows="4" placeholder="Enter breakfast meal plan details...">Oatmeal with Berries (50g oats, 100g mixed berries) - 250 kcal
Boiled Eggs (2 eggs) - 156 kcal
Orange Juice (200ml) - 90 kcal</textarea>
          </div>

          <!-- Lunch Plan -->
          <div class="form-group">
            <label for="lunch">Lunch Plan</label>
            <textarea id="lunch" rows="4" placeholder="Enter lunch meal plan details...">Grilled Chicken Breast (150g) - 248 kcal
Brown Rice (150g) - 165 kcal
Mixed Vegetables (200g) - 80 kcal
Garden Salad (100g) - 95 kcal</textarea>
          </div>

          <!-- Dinner Plan -->
          <div class="form-group">
            <label for="dinner">Dinner Plan</label>
            <textarea id="dinner" rows="4" placeholder="Enter dinner meal plan details...">Baked Salmon (150g) - 312 kcal
Sweet Potato (200g) - 180 kcal
Steamed Broccoli (150g) - 51 kcal</textarea>
          </div>

          <!-- Notes -->
          <div class="form-group">
            <label for="notes">Dietitian Notes</label>
            <textarea id="notes" rows="5" placeholder="Enter any additional notes or instructions...">This meal plan is designed to provide approximately 1,627 calories per day, suitable for gradual weight management. Make sure to drink at least 8 glasses of water throughout the day. You can add healthy snacks like fruits or nuts between meals if needed.</textarea>
          </div>

          <!-- Submit -->
          <div style="padding-top:1rem;">
            <button type="submit" class="btn btn-primary flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save Plan
            </button>
          </div>

        </form>
      </div>

    </div>
  </main>

</div>

<script>
  document.getElementById('plan-form').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Meal plan saved successfully!');
    window.location.href = 'dietitian-users.html';
  });
</script>

</body>
</html>
