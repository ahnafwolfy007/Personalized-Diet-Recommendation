<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DietSync – Login</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="auth-page">

  <div class="auth-wrap">
    <div class="card p-8">

      <!-- Logo -->
      <div class="mb-8">
        <div class="flex items-center gap-2 justify-center mb-6">
          <span class="logo-icon logo-large"></span>
          <span class="font-medium text-xl">DietSync</span>
        </div>
        <h1 class="text-2xl text-center mb-2">Login</h1>
        <p class="text-center text-gray">Enter your credentials to continue</p>
      </div>

      <!-- Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="user@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <div class="select-wrapper">
            <select id="role">
              <option value="User">User</option>
              <option value="Dietitian">Dietitian</option>
              <option value="Admin">Admin</option>
            </select>
            <span class="select-arrow">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-w-full py-3">Login</button>
      </form>

      <!-- Register link -->
      <div class="mt-6 text-center">
        <p class="text-gray">
          Don't have an account?
          <a href="register.html" class="text-green link-clean">Register</a>
        </p>
      </div>

    </div>
  </div>

</body>
</html>
